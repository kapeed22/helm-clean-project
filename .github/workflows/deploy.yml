name: Build and Deploy to K8s via Helm

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Choose target environment (dev, test, prod)'
        required: true
        default: 'dev'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Added explicit permissions to push containers to GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}

  deploy-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Added explicit permissions for AWS OIDC authentication
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Selected Helm Environment via AWS SSM
        run: |
          ENV_NAME="${{ github.event.inputs.target_env || 'dev' }}"
          IMAGE_TAG="${{ github.sha }}"

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_MASTER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'mkdir -p /mnt/data/${ENV_NAME}',
              'chmod -R 777 /mnt/data',
              'kubectl create ns ${ENV_NAME} --dry-run=client -o yaml | kubectl apply -f -',
              'helm upgrade --install ${ENV_NAME}-release ./three-tier-app -f ./three-tier-app/values-${ENV_NAME}.yaml --set imageTag=${IMAGE_TAG} -n ${ENV_NAME}'
            ]"
