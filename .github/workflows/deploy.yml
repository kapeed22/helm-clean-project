name: Build and Deploy to K8s via Helm

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Choose target environment (dev, test, prod)'
        required: true
        default: 'dev'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}

  deploy-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Selected Helm Environment via AWS SSM
        run: |
          # 1. Determine environment dynamically
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.target_env }}"
          else
            ENV_NAME="dev"
          fi

          IMAGE_TAG="${{ github.sha }}"

          # 2. Send command and capture Command ID
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_MASTER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "export KUBECONFIG=/etc/kubernetes/admin.conf",
              "cd /home/ubuntu/app || exit 1",
              "git fetch --all && git reset --hard origin/main",
              "mkdir -p /mnt/data/'"${ENV_NAME}"' && chmod -R 777 /mnt/data",
              "helm upgrade --install '"${ENV_NAME}"'-release ./three-tier-app -f ./three-tier-app/values-'"${ENV_NAME}"'.yaml --set imageTag='"${IMAGE_TAG}"' -n '"${ENV_NAME}"' --create-namespace"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 3. Wait for execution and fail GitHub Actions if the script fails on EC2
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_MASTER_INSTANCE_ID }}"

          # 4. Check exit code
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[0].Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM Command failed with status: $STATUS"
            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].CommandPlugins[0].Output" \
              --output text
            exit 1
          fi
